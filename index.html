<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CW Battle Royale</title>
  <meta name="description" content="CW 배틀 로얄 팬 페이지. 레이더, 섬 지도, 출석부를 한 화면에서 봅니다." />
  <link href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="pixel.css" />
</head>
<body>
  <a class="skip" href="#roster">출석부로 건너뛰기</a>

  <div class="stage" id="stage">
    <canvas id="scene" aria-hidden="true"></canvas>
    <div class="note note-yellow" id="note-zones" aria-hidden="true"></div>
    <div class="note note-pink" aria-hidden="true">18:00 방송<br>꼭 듣기!!</div>
    <div class="screen" id="screen">
        <div class="screen-scroll" tabindex="-1">

  <header class="topbar">
    <span class="app-icon" aria-hidden="true"></span>
    <h1><span id="game-title">CW BATTLE ROYALE</span> <small>프로그램 관리 시스템 2.1</small></h1>
    <span class="win-btns" aria-hidden="true"><i></i><i></i><i></i></span>
  </header>

  <main class="board">
    <section class="panel panel-broadcast" aria-labelledby="h-broadcast">
      <h2 id="h-broadcast">정기 방송</h2>
      <ol id="broadcast-list" class="broadcast-list"></ol>
    </section>

    <section class="panel panel-notice" aria-labelledby="h-notice">
      <h2 id="h-notice">규칙</h2>
      <ul id="notice-list" class="notice-list"></ul>
    </section>

    <section class="panel panel-radar" aria-labelledby="h-radar">
      <h2 id="h-radar">레이더</h2>
      <div class="radar-wrap">
        <svg id="radar" class="radar" viewBox="-110 -110 220 220" role="img" aria-label="선택한 학생 주변의 생존자 레이더">
          <defs>
            <radialGradient id="sweepGrad" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="var(--phosphor)" stop-opacity="0.45" />
              <stop offset="1" stop-color="var(--phosphor)" stop-opacity="0" />
            </radialGradient>
          </defs>
          <circle r="100" class="r-ring r-outer" />
          <circle r="75" class="r-ring" />
          <circle r="50" class="r-ring" />
          <circle r="25" class="r-ring" />
          <line x1="-100" y1="0" x2="100" y2="0" class="r-axis" />
          <line x1="0" y1="-100" x2="0" y2="100" class="r-axis" />
          <g class="r-sweep"><path d="M0 0 L0 -100 A100 100 0 0 1 70.7 -70.7 Z" fill="url(#sweepGrad)" /></g>
          <g id="radar-blips"></g>
          <rect x="-3.5" y="-3.5" width="7" height="7" class="r-center" />
        </svg>
      </div>
      <p class="radar-legend" id="radar-legend">출석부에서 학생을 고르면 주변 생존자가 보입니다.</p>
    </section>

    <section class="panel panel-roster" id="roster" aria-labelledby="h-roster">
      <h2 id="h-roster"><span id="class-label"></span> 출석부</h2>
      <div class="roster-tools">
        <div class="filters" role="group" aria-label="상태로 거르기">
          <button class="chip is-on" data-filter="all" aria-pressed="true">전체</button>
          <button class="chip" data-filter="alive" aria-pressed="false">생존</button>
          <button class="chip" data-filter="hurt" aria-pressed="false">부상</button>
          <button class="chip" data-filter="dead" aria-pressed="false">사망</button>
        </div>
        <div class="search">
          <label for="search-input">찾기</label>
          <input id="search-input" type="search" placeholder="이름이나 무기" autocomplete="off" />
        </div>
      </div>
      <ul id="roster-grid" class="roster-grid"></ul>
    </section>

    <section class="panel panel-map" aria-labelledby="h-map">
      <h2 id="h-map">섬 지도</h2>
      <div class="map-wrap">
        <div id="map" class="map" role="grid" aria-label="섬 지도 격자"></div>
      </div>
      <ul class="map-legend">
        <li><i class="lg lg-danger"></i>금지구역</li>
        <li><i class="lg lg-next"></i>다음 금지구역</li>
        <li><i class="lg lg-alive"></i>생존</li>
        <li><i class="lg lg-dead"></i>사망</li>
      </ul>
      <p class="map-readout" id="map-readout" aria-live="polite"></p>
    </section>

    <section class="panel panel-stats" aria-labelledby="h-stats">
      <h2 id="h-stats">능력치</h2>
      <svg id="hex" class="hex" viewBox="-130 -120 260 240" role="img" aria-label="선택한 학생 능력치 육각형 차트"></svg>
    </section>

    <section class="panel panel-detail" aria-labelledby="h-detail" aria-live="polite">
      <h2 id="h-detail">학생 기록</h2>
      <div id="detail" class="detail"></div>
    </section>
  </main>

  <footer class="foot">
    <p class="status-line" id="status-line" aria-live="polite"></p>
    <p class="foot-note">비공식 팬 페이지입니다. 인물과 설정은 모두 임시 데이터예요.</p>
  </footer>

        </div>
        <div class="screen-fx" aria-hidden="true"></div>
        <div class="lcd-defects" aria-hidden="true">
          <i class="dp dp-dead" style="left:23.4%;top:31.2%"></i>
          <i class="dp dp-dead" style="left:71.9%;top:58.6%"></i>
          <i class="dp dp-green" style="left:46.3%;top:17.8%"></i>
          <i class="dp dp-white" style="left:84.1%;top:22.5%"></i>
          <i class="stuck-line"></i>
          <i class="band"></i>
        </div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
  <script src="scene.js"></script>
</body>
</html>
